<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه استعدادیابی مهارت‌محور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">
  <div class="max-w-2xl mx-auto">
    
    <!-- فرم لاگین -->
    <div id="login-box" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h1 class="text-xl font-bold mb-4 text-center">ورود به سامانه پایش مهارت</h1>
      <p class="text-sm text-slate-500 mb-6 text-center">کد پرونده فرزند خود را وارد کنید</p>
      <input type="text" id="student-code" placeholder="کد دانش‌آموز (مثال: 101)" class="w-full border p-3 rounded-xl mb-4 text-center font-bold text-lg outline-none focus:border-indigo-600">
      <button onclick="login()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">ورود</button>
      <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
    </div>

<!-- فرم ارزیابی -->
    <div id="quiz-box" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hidden">
      <div class="flex flex-wrap justify-between items-center border-b pb-4 mb-6 gap-2">
        <div>
          <span class="text-xs text-slate-400">دانش‌آموز:</span>
          <h2 id="student-display" class="font-bold text-indigo-700"></h2>
        </div>
        <span id="skill-title" class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-bold"></span>
      </div>

      <!-- نوار ناوبری سریع مهارت‌ها -->
      <div class="mb-6">
        <label class="text-xs text-slate-500 block mb-1.5 font-medium">پرش به مهارت دیگر:</label>
        <select id="skill-jump-select" onchange="jumpToSkill(this.value)" class="w-full border border-slate-200 p-2.5 rounded-xl text-sm bg-slate-50 outline-none focus:border-indigo-600 font-medium text-slate-700"></select>
      </div>

      <div id="questions-container" class="space-y-6"></div>

      <!-- دکمه‌های ناوبری و اقدام -->
      <div class="mt-8 border-t pt-6 space-y-3">
        <!-- ردیف ناوبری گام‌به‌گام -->
        <div class="flex gap-3">
          <button id="btn-prev" onclick="prevSkill()" type="button" class="w-1/3 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-200 transition text-sm disabled:opacity-40 disabled:cursor-not-allowed">
            ← مهارت قبل
          </button>
          <button id="btn-next" onclick="submitCurrentSkill(false)" type="button" class="w-2/3 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition text-sm shadow-md shadow-indigo-100">
            ثبت این مهارت و بعدی →
          </button>
        </div>

        <!-- دکمه رد کردن -->
        <button onclick="skipCurrentSkill()" type="button" class="w-full bg-amber-50 text-amber-700 border border-amber-200 py-2.5 rounded-xl text-xs font-bold hover:bg-amber-100 transition">
          رد کردن این مهارت (عدم تمایل / بدون پاسخ) ⏭
        </button>

        <!-- دکمه همیشگی ثبت نهایی و خروج در تمام صفحات -->
        <div class="pt-2 border-t border-dashed border-slate-200">
          <button onclick="finishAssessment()" type="button" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition text-sm shadow-md shadow-emerald-100">
            ثبت نهایی و اتمام ارزیابی ✓
          </button>
        </div>
      </div>
    </div>

    <!-- پیام پایان (طراحی ایزوله و مطمئن) -->
    <div id="success-box" style="display: none;" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center my-6">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">✓</div>
      <h2 class="text-xl font-bold mb-2 text-slate-800">ارزیابی با موفقیت ثبت شد</h2>
      <p class="text-slate-500 text-sm mb-6 leading-relaxed">
        پاسخ‌های شما در پرونده استعدادیابی دانش‌آموز ذخیره شد. مدرسه اطلاعات را بررسی و کارنامه تحلیل استعداد را صادر خواهد کرد.
      </p>
      <button onclick="location.reload()" class="bg-indigo-50 text-indigo-700 px-6 py-2.5 rounded-xl text-sm font-bold hover:bg-indigo-100 transition">
        خروج / ورود دانش‌آموز دیگر
      </button>
    </div>

  </div>
  <script src="/app.js"></script>
</body>
</html>
