<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دبستان مهارت‌محور آپادانا</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/Vazirmatn-FD-font-face.css" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn FD', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between p-6">
  <header class="max-w-5xl mx-auto w-full flex justify-between items-center py-4">
    <div class="font-black text-indigo-900 text-lg sm:text-xl">دبستان تخصصی آپادانا</div>
    <div class="flex gap-2">
      <a href="/parent-survey" class="text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3.5 py-2 rounded-xl transition">فرم اولیا</a>
      <a href="/admin" class="text-xs font-bold text-slate-600 bg-white border border-slate-200 hover:bg-slate-100 px-3.5 py-2 rounded-xl transition">پنل کادر</a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto w-full text-center my-auto space-y-6">
    <div class="w-16 h-16 bg-indigo-600 text-white rounded-3xl flex items-center justify-center mx-auto text-2xl shadow-lg shadow-indigo-100">🏫</div>
    <h1 class="text-2xl sm:text-3xl font-black text-slate-800">سامانه جامع استعدادیابی و رشد فردی</h1>
    <p class="text-xs sm:text-sm text-slate-500 leading-relaxed max-w-lg mx-auto">
      پایش علمی علایق، هوش‌های چندگانه و هدایت مسیر رشد دانش‌آموزان از نقطه پتانسیل اولیه به مهارت عملی.
    </p>
    <div class="flex flex-wrap justify-center gap-3 pt-2">
      <a href="/parent-survey" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-6 py-3 rounded-xl transition shadow-sm">
        ورود به پرسش‌نامه استعدادیابی اولیا
      </a>
      <a href="/admin" class="bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold px-6 py-3 rounded-xl transition">
        ورود به پنل مدیریت و مشاوران
      </a>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">
    تمامی حقوق محفوظ است © دبستان مهارت‌محور آپادانا
  </footer>
</body>
</html>
