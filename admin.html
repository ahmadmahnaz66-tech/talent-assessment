<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت و هدایت استعدادها</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/Vazirmatn-FD-font-face.css" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn FD', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-6">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- نوار عنوان -->
    <header class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-black text-slate-800">پنل تخصصی مشاوره و سنجش استعداد</h1>
        <p class="text-xs text-slate-500 mt-1">مدیریت گزارش‌ها، دانش‌آموزان، مهارت‌ها و گویه‌ها</p>
      </div>
      <a href="/" class="text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3.5 py-2 rounded-xl transition">
        مشاهده صفحه سنجش دانش‌آموزان ←
      </a>
    </header>

    <!-- تب‌های ناوبری -->
    <nav class="flex flex-wrap gap-2 border-b border-slate-200 pb-3">
      <button onclick="switchTab('individual')" id="tab-btn-individual" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white transition">
        ۱. کارنامه و تحلیل فردی
      </button>
      <button onclick="switchTab('group')" id="tab-btn-group" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-50 border border-slate-200 transition">
        ۲. گزارش و غربالگری گروهی
      </button>
      <button onclick="switchTab('manage')" id="tab-btn-manage" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-50 border border-slate-200 transition">
        ۳. مدیریت مهارت‌ها و سوالات
      </button>
    </nav>

    <!-- محتوای تب ۱: کارنامه فردی -->
    <section id="tab-content-individual" class="tab-content space-y-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center gap-3">
        <label class="text-xs font-bold text-slate-700">انتخاب پرونده دانش‌آموز:</label>
        <select id="student-select" onchange="fetchStudentReport(this.value)" class="border border-slate-200 p-2.5 rounded-xl text-xs bg-slate-50 outline-none focus:border-indigo-600 min-w-[220px]">
          <option value="">در حال بارگذاری...</option>
        </select>
      </div>
      <div id="student-report-results" class="space-y-3"></div>
    </section>

    <!-- محتوای تب ۲: گزارش گروهی -->
    <section id="tab-content-group" class="tab-content hidden space-y-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center gap-3">
        <label class="text-xs font-bold text-slate-700">فیلتر بر اساس مهارت:</label>
        <select id="skill-filter-select" onchange="fetchSkillGroupReport(this.value)" class="border border-slate-200 p-2.5 rounded-xl text-xs bg-slate-50 outline-none focus:border-indigo-600 min-w-[220px]">
          <option value="">انتخاب مهارت...</option>
        </select>
      </div>
      <div id="skill-group-results" class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm"></div>
    </section>

    <!-- محتوای تب ۳: مدیریت مهارت‌ها و سوالات -->
    <section id="tab-content-manage" class="tab-content hidden space-y-5">
      <!-- تعریف مهارت جدید -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
        <h2 class="font-bold text-slate-800 text-sm mb-3">تعریف حوزه مهارتی جدید</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <input type="text" id="new-skill-slug" placeholder="شناسه انگلیسی یکتا (مثال: astronomy)" class="border border-slate-200 p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
          <input type="text" id="new-skill-title" placeholder="عنوان فارسی (مثال: نجوم و فضا)" class="border border-slate-200 p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
          <button onclick="createNewSkill()" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold py-2.5 transition">
            ثبت مهارت جدید +
          </button>
        </div>
      </div>

      <!-- مدیریت سوالات مهارت انتخاب‌شده -->
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <label class="text-xs font-bold text-slate-700">مهارت فعال:</label>
            <select id="manage-skill-select" onchange="loadQuestionsForAdmin(this.value)" class="border border-slate-200 p-2 rounded-xl text-xs bg-slate-50 outline-none focus:border-indigo-600"></select>
          </div>
          <button onclick="deleteSelectedSkill()" class="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 px-3 py-1.5 rounded-lg transition">
            حذف این مهارت و سوالات آن
          </button>
        </div>

        <!-- فرم افزودن سوال -->
        <div class="flex gap-2">
          <input type="text" id="new-question-text" placeholder="متن گویه/سوال جدید را بنویسید..." class="flex-1 border border-slate-200 p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
          <button onclick="addQuestionToSkill()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 rounded-xl text-xs font-bold transition">
            افزودن گویه +
          </button>
        </div>

        <!-- لیست سوالات -->
        <div id="admin-questions-list" class="space-y-2 pt-2"></div>
      </div>
    </section>

  </div>

  <!-- فراخوانی اسکریپت کنترلر مجزا -->
  <script src="/admin.js"></script>
</body>
</html>
