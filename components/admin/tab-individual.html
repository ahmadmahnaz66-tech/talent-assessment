<!-- components/admin/tab-individual.html -->
<section class="tab-content hidden space-y-5">
  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-end justify-between gap-4">
    <div class="flex-1 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="max-w-md flex-1 space-y-2">
        <label class="block text-xs font-bold text-slate-700">انتخاب پرونده دانش‌آموز:</label>
        <div class="relative">
          <input type="text" id="student-search-input" oninput="filterStudentDropdown(this.value)" placeholder="🔍 جستجوی زنده (نام، فامیل یا کدملی)..." class="w-full border border-slate-200 bg-white p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600 shadow-sm transition">
        </div>
        <select id="student-select" onchange="onStudentSelectChanged()" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs bg-slate-50 outline-none focus:border-indigo-600 font-medium">
          <option value="">انتخاب پرونده...</option>
        </select>
      </div>

      <div class="pb-1">
        <button onclick="checkAndSyncPendingRoadmaps()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs transition shadow-sm flex items-center gap-2 whitespace-nowrap">
          <span>🔄</span>
          <span>به‌روزرسانی خودکار پرونده‌های تغییریافته</span>
        </button>
      </div>
    </div>
    
    <button id="btn-generate-ai" onclick="generateNewRoadmapAnalysis()" class="hidden bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow transition flex items-center gap-1.5">
      ✨ صدور کارنامه و تحلیل جدید هوش مصنوعی
    </button>
  </div>

  <div id="sync-progress-box" class="hidden bg-indigo-50 border border-indigo-200 p-3.5 rounded-2xl space-y-2">
    <div class="flex justify-between items-center text-xs font-bold text-slate-700">
      <span id="sync-status-text">در حال بررسی...</span>
      <span id="sync-status-count" class="font-mono text-indigo-600">۰ / ۰</span>
    </div>
    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
      <div id="sync-progress-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
  </div>

  <div id="ai-history-card" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-2">
    <h3 class="text-xs font-bold text-slate-800">📁 تاریخچه اسناد و تحلیل‌های صادرشده این پرونده:</h3>
    <div id="history-container" class="flex flex-wrap gap-2 text-xs pt-1"></div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-4 border-b border-slate-100 font-bold text-xs text-slate-700">کارنامه اولویت‌بندی مهارت‌ها</div>
    <div class="overflow-x-auto">
      <table class="w-full text-right text-xs">
        <thead class="bg-slate-50 text-slate-500 border-b">
          <tr>
            <th class="p-3 w-16 text-center">اولویت</th>
            <th class="p-3">عنوان مهارت</th>
            <th class="p-3 w-20 text-center">امتیاز</th>
            <th class="p-3 w-36 text-center">وضعیت استعداد</th>
          </tr>
        </thead>
        <tbody id="student-report-results" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>
</section>
