<!-- components/admin/tab-group.html -->
<section id="tab-content-group" class="tab-content hidden space-y-5">
  <!-- نمودارهای ثابت کلان مدرسه -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5" id="analytics-dashboard-section">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <h3 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-2">
          <span>📊</span> میانگین پروفایل هوش‌های چندگانه گاردنر در مدرسه
        </h3>
        <span class="text-[11px] px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full font-bold" id="gardner-total-badge">در حال دریافت...</span>
      </div>
      <div class="relative h-64 w-full">
        <canvas id="gardnerBarChart"></canvas>
      </div>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <h3 class="font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-2">
          <span>🧭</span> توزیع تیپ‌های رغبت‌سنجی هالند (RIASEC)
        </h3>
        <span class="text-[11px] px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full font-bold" id="holland-total-badge">در حال دریافت...</span>
      </div>
      <div class="relative h-64 w-full flex items-center justify-center">
        <canvas id="hollandRadarChart"></canvas>
      </div>
    </div>
  </div>

  <!-- فیلتر مهارت و رتبه‌بندی -->
  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center gap-3">
    <label class="text-xs font-bold text-slate-700">فیلتر مهارت:</label>
    <select id="skill-filter-select" onchange="fetchSkillGroupReport(this.value)" class="border border-slate-200 p-2.5 rounded-xl text-xs bg-slate-50 outline-none min-w-[220px]">
      <option value="">انتخاب مهارت...</option>
    </select>
  </div>

  <!-- نمودارهای اختصاصی منتخبین مهارت انتخاب‌شده -->
  <div id="skill-charts-container" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 bg-indigo-50/20">
      <div class="flex items-center justify-between mb-4 border-b border-indigo-100 pb-3">
        <h3 class="font-bold text-indigo-950 text-xs sm:text-sm flex items-center gap-2">
          <span>🎯</span> گاردنر در منتخبین این مهارت
        </h3>
        <span class="text-[11px] px-2.5 py-1 bg-indigo-100 text-indigo-800 rounded-full font-bold" id="skill-gardner-badge">-</span>
      </div>
      <div class="relative h-64 w-full">
        <canvas id="skillGardnerBarChart"></canvas>
      </div>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 bg-emerald-50/20">
      <div class="flex items-center justify-between mb-4 border-b border-emerald-100 pb-3">
        <h3 class="font-bold text-emerald-950 text-xs sm:text-sm flex items-center gap-2">
          <span>🧭</span> تیپ غالب هالند منتخبین
        </h3>
        <span class="text-[11px] px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full font-bold" id="skill-holland-badge">-</span>
      </div>
      <div class="relative h-64 w-full flex items-center justify-center">
        <canvas id="skillHollandRadarChart"></canvas>
      </div>
    </div>
  </div>

  <div id="skill-group-results" class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm"></div>
</section>
