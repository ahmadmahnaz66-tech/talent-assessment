<!-- components/admin/tab-manage.html -->
<section class="tab-content hidden space-y-5">
  <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="text-xl">📊</span>
      <div>
        <h4 class="text-xs font-black text-slate-800">عملیات گروهی با اکسل</h4>
        <p class="text-[10px] text-slate-400">دریافت فایل پشتیبان کامل یا بارگذاری یکباره مهارت‌ها و گویه‌ها</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="exportSkillsAndQuestionsToExcel()" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm">
        <span>📥 دانلود اکسل تمام سوالات</span>
      </button>

      <label class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm cursor-pointer">
        <span>📤 بارگذاری از اکسل</span>
        <input type="file" id="excel-import-questions-input" accept=".xlsx, .xls, .csv" class="hidden" onchange="importSkillsAndQuestionsFromExcel(event)">
      </label>
    </div>
  </div>

  <!-- بخش تعریف مهارت جدید و دکمه تکمیل هوشمند -->
  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
    <h2 class="font-bold text-slate-800 text-sm mb-3">تعریف مهارت جدید</h2>
    <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
      <input type="text" id="new-skill-slug" placeholder="شناسه انگلیسی (مثال: astronomy)" class="border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
      <input type="text" id="new-skill-title" placeholder="عنوان فارسی (مثال: نجوم و فضا)" class="border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
      
      <select id="new-skill-category" class="border border-slate-200 p-2.5 rounded-xl text-xs bg-slate-50 outline-none font-bold text-slate-700">
        <option value="investigative">کاوشگر / تحلیلی (I)</option>
        <option value="artistic">هنری / خلاق (A)</option>
        <option value="social">اجتماعی / ارتباطی (S)</option>
        <option value="enterprising">متهور / رهبری (E)</option>
        <option value="conventional">قراردادی / نظم‌گرا (C)</option>
        <option value="realistic">واقع‌گرا / عملیاتی (R)</option>
      </select>

      <button onclick="createNewSkill()" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold py-2.5 transition">ثبت مهارت (دستی)</button>
      
      <button type="button" onclick="generateSkillWithAI()" id="btn-ai-skill" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white text-xs font-bold px-3 py-2.5 rounded-xl transition shadow-sm flex items-center justify-center gap-1.5">
        <span>✨</span>
        <span>تولید ۱۵ گویه با AI</span>
      </button>
    </div>

    <div class="pt-2 border-t border-slate-100 flex justify-end">
      <button type="button" onclick="syncMissingQuestionsWithAI()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-1.5">
        <span>⚡</span>
        <span>تکمیل هوشمند گویه‌های ناقص با AI</span>
      </button>
    </div>
  </div>

  <!-- بخش نمایش دو ستونۀ سوالات دانش‌آموز و مربی -->
  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-100">
      <div class="flex items-center gap-2">
        <label class="text-xs font-bold text-slate-700">مهارت فعال:</label>
        <select id="manage-skill-select" onchange="loadQuestionsForAdmin(this.value)" class="border border-slate-200 p-2 rounded-xl text-xs bg-slate-50 outline-none"></select>
      </div>
      <button onclick="deleteSelectedSkill()" class="text-xs text-red-500 hover:text-red-700 font-bold border border-red-200 px-3 py-1.5 rounded-lg transition">حذف این مهارت</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="space-y-2 bg-slate-50/50 p-3 rounded-2xl border border-slate-100">
        <h3 class="text-xs font-black text-indigo-950 mb-2 flex items-center gap-1.5">
          <span>📋</span> گویه‌های تست دانش‌آموز:
        </h3>
        <div class="flex gap-2">
          <input type="text" id="new-question-text" placeholder="متن گویه جدید دانش‌آموز..." class="flex-1 border border-slate-200 p-2 rounded-xl text-xs outline-none bg-white">
          <button onclick="addQuestionToSkill()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 rounded-xl text-xs font-bold transition">افزودن +</button>
        </div>
        <div id="admin-questions-list" class="space-y-2 pt-1 max-h-72 overflow-y-auto"></div>
      </div>

      <div class="space-y-2 bg-indigo-50/30 p-3 rounded-2xl border border-indigo-100">
        <h3 class="text-xs font-black text-indigo-950 mb-2 flex items-center gap-1.5">
          <span>⚙️</span> چک‌لیست ارزیابی تخصصی مربی (۱۰ گویه):
        </h3>
        <div class="text-[11px] text-slate-500 mb-2">این گویه‌ها مستقیماً برای ارزیابی عملکرد مربی در تب مجاورت‌سازی استفاده می‌شوند.</div>
        <div id="admin-coach-questions-list" class="space-y-2 pt-1 max-h-72 overflow-y-auto"></div>
      </div>
    </div>
  </div>
</section>
