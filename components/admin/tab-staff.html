<!-- components/admin/tab-staff.html -->
<section id="tab-content-staff" class="tab-content hidden space-y-5">
  <div id="add-staff-container" class="hidden bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
    <h2 class="font-bold text-slate-800 text-xs">تعریف حساب کاربری جدید برای کادر مدرسه</h2>
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
      <input type="text" id="staff-name" placeholder="نام و نام خانوادگی (مثال: خانم علوی)" class="border p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
      <input type="text" id="staff-username" placeholder="نام کاربری انگلیسی (مثال: alavi)" class="border p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
      <input type="password" id="staff-password" placeholder="رمز عبور اولیه (حداقل ۵ رقم)" class="border p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
      <select id="staff-role" class="border p-2.5 rounded-xl text-xs bg-slate-50 outline-none focus:border-indigo-600 font-bold">
        <option value="counselor">مشاور تخصصی مدرسه</option>
        <option value="principal">مدیر مدرسه</option>
        <option value="vice_principal">معاون مدرسه</option>
        <option value="expose_coach">مربی (Expose Coach)</option>
      </select>
    </div>
    <button onclick="handleCreateStaff()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition">
      ثبت و ایجاد دسترسی
    </button>
  </div>

  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
    <h3 class="font-bold text-slate-800 text-xs">لیست کادر و نقش‌های فعال سامانه</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-right text-xs">
        <thead class="bg-slate-50 text-slate-500 border-b">
          <tr>
            <th class="p-3">نام و نام خانوادگی</th>
            <th class="p-3">نام کاربری</th>
            <th class="p-3">نقش و سطح دسترسی</th>
            <th class="p-3 text-left">عملیات</th>
          </tr>
        </thead>
        <tbody id="staff-table-body" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>
</section>
