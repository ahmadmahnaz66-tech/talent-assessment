<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت سایت و درگاه کارت‌به‌کارت | مهناز مسعودی</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/misc/Farsi-Digits/Vazirmatn-FD-font-face.css">
  <style>
    body { font-family: 'Vazirmatn FD', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen p-4 sm:p-8">

  <!-- کادر ورود به مدیریت سایت -->
  <div id="login-box" class="max-w-md mx-auto my-16 bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl font-bold mx-auto mb-2">
        ⚙️
      </div>
      <h1 class="text-lg font-black text-slate-900">ورود به مدیریت سایت اختصاصی</h1>
      <p class="text-xs text-slate-500 mt-1">مدیریت مالی، شماره کارت و تایید فیش‌ها</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">نام کاربری مدیر ارشد:</label>
        <input type="text" id="admin-user" placeholder="نام کاربری" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">رمز عبور:</label>
        <input type="password" id="admin-pass" placeholder="رمز عبور" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none focus:border-indigo-600">
      </div>
      <button onclick="loginSiteAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3 rounded-xl transition">
        ورود به پنل
      </button>
      <p id="login-err" class="text-xs text-rose-500 text-center font-bold hidden"></p>
    </div>
  </div>

  <!-- داشبورد مدیریت سایت -->
  <div id="admin-dashboard" class="max-w-5xl mx-auto hidden space-y-6">
    
    <!-- هدر پنل -->
    <header class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
      <div>
        <h2 class="text-base font-black text-slate-900">پنل مدیریت سایت | مهناز مسعودی</h2>
        <p class="text-xs text-slate-500 mt-0.5">تنظیمات پرداخت، تایید فیش‌های کارت‌به‌کارت و کاربران</p>
      </div>
      <button onclick="logoutAdmin()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-4 py-2 rounded-xl transition">
        خروج از پنل
      </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- فرم ویرایش اطلاعات بانکی -->
      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm md:col-span-1 space-y-4">
        <h3 class="text-sm font-black text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
          <span>💳</span>
          <span>مشخصات حساب کارت‌به‌کارت</span>
        </h3>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">شماره کارت بانکی:</label>
          <input type="text" id="set-card-number" placeholder="مثال: 6037..." class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none font-mono">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">نام صاحب حساب:</label>
          <input type="text" id="set-card-holder" placeholder="مثال: مهناز مسعودی" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">نام بانک:</label>
          <input type="text" id="set-card-bank" placeholder="مثال: بانک ملی" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">هزینه اشتراک ماهانه (تومان):</label>
          <input type="number" id="set-sub-price" placeholder="50000" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none font-mono">
        </div>

        <button onclick="saveSiteSettings()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-3 rounded-xl transition shadow-sm">
          ذخیره تغییرات مشخصات کارت
        </button>
      </div>

      <!-- جدول تایید فیش‌های واریزی کاربران -->
      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm md:col-span-2 space-y-4">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3">
          <h3 class="text-sm font-black text-slate-900 flex items-center gap-2">
            <span>📥</span>
            <span>فیش‌های کارت‌به‌کارت دریافتی</span>
          </h3>
          <button onclick="loadReceipts()" class="text-indigo-600 text-xs font-bold hover:underline">
            ⟳ به‌روزرسانی لیست
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-right text-xs">
            <thead class="bg-slate-50 text-slate-600 border-b border-slate-100">
              <tr>
                <th class="p-3">کاربر</th>
                <th class="p-3">مبلغ</th>
                <th class="p-3">۴ رقم کارت</th>
                <th class="p-3">کد پیگیری</th>
                <th class="p-3">وضعیت</th>
                <th class="p-3 text-center">عملیات</th>
              </tr>
            </thead>
            <tbody id="receipts-tbody" class="divide-y divide-slate-100">
              <tr>
                <td colspan="6" class="text-center py-6 text-slate-400">در حال دریافت داده‌ها...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    let activeAdmin = null;

    async function loginSiteAdmin() {
      const username = document.getElementById('admin-user').value.trim();
      const password = document.getElementById('admin-pass').value.trim();
      const err = document.getElementById('login-err');
      err.classList.add('hidden');

      if (!username || !password) {
        err.innerText = 'نام کاربری و رمز عبور الزامی است.';
        err.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'staff-login', username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          activeAdmin = data.user;
          sessionStorage.setItem('siteAdminUser', JSON.stringify(activeAdmin));
          showDashboard();
        } else {
          err.innerText = data.error || 'اطلاعات ورود نادرست است.';
          err.classList.remove('hidden');
        }
      } catch (e) {
        err.innerText = 'خطا در ارتباط با سرور: ' + e.message;
        err.classList.remove('hidden');
      }
    }

    function showDashboard() {
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('admin-dashboard').classList.remove('hidden');
      loadSettings();
      loadReceipts();
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const s = await res.json();
        if (s.card_number) document.getElementById('set-card-number').value = s.card_number;
        if (s.card_holder) document.getElementById('set-card-holder').value = s.card_holder;
        if (s.card_bank) document.getElementById('set-card-bank').value = s.card_bank;
        if (s.sub_price) document.getElementById('set-sub-price').value = s.sub_price;
      } catch (e) {
        console.error('خطا در بارگذاری تنظیمات:', e);
      }
    }

    async function saveSiteSettings() {
      if (!activeAdmin) return;
      const settings = {
        card_number: document.getElementById('set-card-number').value.trim(),
        card_holder: document.getElementById('set-card-holder').value.trim(),
        card_bank: document.getElementById('set-card-bank').value.trim(),
        sub_price: document.getElementById('set-sub-price').value.trim()
      };

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requesterRole: activeAdmin.role, settings })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert('مشخصات بانکی با موفقیت ذخیره شد.');
        } else {
          alert(data.error || 'خطا در ذخیره مشخصات.');
        }
      } catch (e) {
        alert('خطا در برقراری ارتباط با سرور.');
      }
    }

    async function loadReceipts() {
      const tbody = document.getElementById('receipts-tbody');
      tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-slate-400">در حال دریافت...</td></tr>';

      try {
        const res = await fetch('/api/payment-receipt');
        const receipts = await res.json();

        if (!Array.isArray(receipts) || receipts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-6 text-slate-400">هیچ فیشی ثبت نشده است.</td></tr>';
          return;
        }

        tbody.innerHTML = receipts.map(r => {
          let badge = '<span class="px-2 py-0.5 rounded-lg bg-amber-50 text-amber-700 font-bold text-[10px]">در انتظار بررسی</span>';
          if (r.status === 'approved') badge = '<span class="px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 font-bold text-[10px]">تایید شده ✓</span>';
          if (r.status === 'rejected') badge = '<span class="px-2 py-0.5 rounded-lg bg-rose-50 text-rose-700 font-bold text-[10px]">رد شده ✕</span>';

          return `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-3 font-bold">${r.user_name || '-'}<br><span class="text-[10px] text-slate-400 font-mono">${r.user_phone}</span></td>
              <td class="p-3 font-mono">${Number(r.amount).toLocaleString('fa-IR')} تومان</td>
              <td class="p-3 font-mono">${r.card_last4}</td>
              <td class="p-3 font-mono">${r.tracking_code}</td>
              <td class="p-3">${badge}</td>
              <td class="p-3 text-center space-x-1 space-x-reverse">
                ${r.status === 'pending' ? `
                  <button onclick="updateReceiptStatus(${r.id}, 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold">تایید</button>
                  <button onclick="updateReceiptStatus(${r.id}, 'rejected')" class="bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold">رد</button>
                ` : '<span class="text-slate-300">-</span>'}
              </td>
            </tr>
          `;
        }).join('');
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-rose-500 font-bold">خطا در دریافت لیست فیش‌ها</td></tr>';
      }
    }

    async function updateReceiptStatus(paymentId, status) {
      if (!confirm(`آیا از ${status === 'approved' ? 'تایید' : 'رد'} این فیش مطمئن هستید؟`)) return;

      try {
        const res = await fetch('/api/payment-receipt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'update-status', paymentId, status })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          loadReceipts();
        } else {
          alert(data.error || 'خطا در ثبت وضعیت');
        }
      } catch (e) {
        alert('خطا در برقراری ارتباط با سرور.');
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('siteAdminUser');
      location.reload();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const saved = sessionStorage.getItem('siteAdminUser');
      if (saved) {
        activeAdmin = JSON.parse(saved);
        showDashboard();
      }
    });
  </script>
</body>
</html>
